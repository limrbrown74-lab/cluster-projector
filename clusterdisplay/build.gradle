apply plugin: "com.android.library"

android {
    namespace "org.clusterprojector.display"
    compileSdk 34

    defaultConfig {
        minSdk 23
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // No external dependencies: only the Android framework is used.
}
