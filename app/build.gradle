apply plugin: "com.android.application"

android {
    namespace "org.clusterprojector.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.clusterprojector.app"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(":clusterdisplay")
}
