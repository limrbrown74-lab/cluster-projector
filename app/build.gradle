apply plugin: "com.android.application"

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "org.clusterprojector.app"
    compileSdk 34

    defaultConfig {
        applicationId "org.clusterprojector.app"
        minSdk 23
        // FX11 为 Android 11 / ecarx 定制系统，云盘等车机预装应用也停留在 targetSdk 28。
        // 使用 28 可避免新版本兼容策略影响后台启动、外部存储日志和车机多 Display 行为。
        targetSdk 28
        versionCode 17
        versionName "1.4.3-fx11-overlay-mirror"
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // 这是面向 FX11 Android 11 车机的侧载工程，不通过 Google Play 分发。
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation project(":clusterdisplay")
}
